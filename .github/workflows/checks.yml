name: Configuration and Robot syntax
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar parser e gate do summary
        run: python3 scripts/summary.py --self-test
      - name: Verificar arquivos versionados
        shell: bash
        run: |
          tracked=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$tracked" ]; then
            printf 'Arquivos ignorados versionados:\n%s\n' "$tracked"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-checks.txt
      - name: Executar testes
        id: tests
        run: python -m pytest -q test_env_loader.py --junitxml=results/junit.xml
      - name: Robot dry run (sem dispositivo)
        id: dryrun
        run: python -m robot --dryrun --xunit junit.xml --outputdir results/dry-run src/Appium/Clients/Home.robot
      - name: Resumo dos testes e completude
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome == 'success' && steps.dryrun.outcome == 'success' && 'success' || 'failure' }}
          EXPECTED_TESTS: '3'
          JUNIT_PATTERN: 'results/**/junit.xml'
          SUMMARY_FILE: 'results/summary.md'
          TEST_SCOPE: 'Dois testes de configuração Python e um dry-run Robot. NÃO executa o app em dispositivo.'
        run: python3 scripts/summary.py
      - uses: actions/upload-artifact@v4
        id: artifact
        if: always()
        with:
          name: results
          path: results/
          retention-days: 30
          if-no-files-found: error
      - name: Link dos resultados
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[Baixar relatórios e evidências](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nArtifact indisponível; confira a etapa de upload.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
